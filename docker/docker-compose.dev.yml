services:
  traefik:
    image: "traefik:v3.7"
    container_name: "lyndrix-traefik-dev"
    hostname: "traefik"
    restart: "unless-stopped"
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    env_file:
      - .env.dev
    environment:
      TZ: "Europe/Berlin"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "28080:8080/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ../.dev/traefik/letsencrypt:/letsencrypt
      - ../.dev/traefik/log:/log
    networks:
      - default
      - secured
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-dev.rule: "Host(`traefik.dev.int.fam-feser.de`)"
      traefik.http.routers.traefik-dev.entrypoints: "websecure"
      traefik.http.routers.traefik-dev.tls: "true"
      traefik.http.routers.traefik-dev.tls.certresolver: "ionos"
      traefik.http.routers.traefik-dev.service: "api@internal"
      traefik.docker.network: "dev-secured"
    security_opt:
      - no-new-privileges:true

  # --- Main Application Service ---
  lyndrix:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lyndrix-core-dev
    # Required for the /api/system/restart self-restart: without a policy, a
    # container that stops (or fails to come back cleanly) stays down.
    restart: "unless-stopped"
    ports:
      - "8081:8081"
    volumes:
      - ../.dev/storage:/data/storage
      - ../app:/app
      - ../.dev/secure_data:/data/security
      - ./entrypoint.sh:/app/entrypoint.sh
      - ../../lyndrix-plugin-iac-orchestrator:/app/plugins/iac_orchestrator
      - ../../lyndrix-plugin-discord-notifier:/app/plugins/discord_notifier
      - ../../lyndrix-plugin-meeting-bingo:/app/plugins/meeting_bingo
      - ../../lyndrix-plugin-monitoring:/app/plugins/state_monitoring
      - ../../lyndrix-plugin-external-services:/app/plugins/external_services
      - ../../lyndrix-plugin-server-manager:/app/plugins/server_manager
      - ../../lyndrix-plugin-docker-manager:/app/plugins/docker_manager
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.dev
    environment:
      - PYTHONUNBUFFERED=1
    # --timeout-graceful-shutdown: SSE connections (/api/events) never close on
    # their own; without a cap every --reload cycle wedges in "Waiting for
    # connections to close" and the API becomes unreachable until a manual
    # container restart.
    command: uvicorn main:app --host 0.0.0.0 --port 8081 --reload --timeout-graceful-shutdown 5
    networks:
      - default
      - secured
    labels:
      traefik.enable: "true"
      traefik.http.routers.lyndrix-dev.rule: "Host(`lyndrix.dev.int.fam-feser.de`)"
      traefik.http.routers.lyndrix-dev.entrypoints: "websecure"
      traefik.http.routers.lyndrix-dev.tls: "true"
      traefik.http.routers.lyndrix-dev.tls.certresolver: "ionos"
      traefik.docker.network: "dev-secured"
      traefik.http.services.lyndrix-dev.loadbalancer.server.port: "8081"
      traefik.http.services.lyndrix-dev.loadbalancer.server.scheme: "http"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started

  db:
    image: mariadb:12.2.2
    container_name: lyndrix-db-dev
    env_file: .env.dev
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MARIADB_DATABASE: ${DB_NAME:-lyndrix_db}
      MARIADB_USER: ${DB_USER:-admin}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ../.dev/db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-uadmin",
          "-p${DB_PASSWORD:-secret}",
        ]
      interval: 5s
      timeout: 2s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: lyndrix-vault-dev
    hostname: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": 1}}, "ui": true}'
      VAULT_API_ADDR: "http://vault:8200"
    volumes:
      - ../.dev/vault_data:/vault/file
    command: server

  docs:
    image: python:3.11-slim
    container_name: lyndrix-docs-dev
    ports:
      - "8000:8000"
    volumes:
      - ../:/workspace
    working_dir: /workspace
    command: bash -c "pip install zensical && zensical serve -a 0.0.0.0:8000"

networks:
  default: {}
  secured:
    name: "dev-secured"
