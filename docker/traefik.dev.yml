global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: "WARN"
  filePath: "/log/traefik.log"

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
    network: "dev-secured"

certificatesResolvers:
  ionos:
    acme:
      email: "marvin@fam-feser.de"
      storage: "/letsencrypt/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: ionos
        propagation:
          delayBeforeChecks: "10s"
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

  ionos-staging:
    acme:
      email: "marvin@fam-feser.de"
      storage: "/letsencrypt/acme-staging.json"
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: ionos
        propagation:
          delayBeforeChecks: "10s"
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
