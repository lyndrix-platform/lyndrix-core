site_name: Lyndrix Core
site_description: Internal Developer Platform Documentation
site_dir: .cache/site
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/icons/logo.svg
  favicon: assets/icons/favicon-32x32.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: emerald
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: emerald
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Installation: deployment.md
  - Plugin Development: plugins.md
  - Core Components:
      - Overview: core-components/index.md
      - Event Bus: core-components/event-bus.md
      - Event Catalog: core-components/events.md
      - Auth: core-components/auth.md
      - Boot: core-components/boot.md
      - Dashboard: core-components/dashboard.md
      - Database: core-components/database.md
      - Git: core-components/git.md
      - Notifications: core-components/notifications.md
      - Plugins: core-components/plugins.md
      - Settings: core-components/settings.md
      - System Monitoring: core-components/system.md
      - Vault: core-components/vault.md
  - Security: security.md
  - Architecture: architecture.md
