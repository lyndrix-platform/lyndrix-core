      - Tiers: ha/tiers.md
      - Architecture & contracts: ha/architecture.md
      - Configuration reference: ha/configuration.md
      - Building blocks:
          - Load balancer: ha/building-blocks/load-balancer.md
          - Coordination: ha/building-blocks/coordination.md
          - Database: ha/building-blocks/database.md
          - Secrets (Vault / OpenBao): ha/building-blocks/secrets.md
          - Shared storage: ha/building-blocks/storage.md
