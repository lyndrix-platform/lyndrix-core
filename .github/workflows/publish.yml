name: Build, Test and Publish

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(awk -F'"' '/^__version__/ {print $2}' app/version.py)"
          if [ -z "$VERSION" ]; then
            echo "Could not read __version__ from app/version.py"
            exit 1
          fi

          TAG="v${VERSION#v}"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f1,2)"
          IS_PRERELEASE="false"
          if printf '%s' "$VERSION" | grep -Eq '[-+]'; then
            IS_PRERELEASE="true"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 0. METADATA & TAGS (BEST PRACTICE)
      # ==========================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease != 'true' && github.ref == 'refs/heads/main' }}

      # ==========================================
      # 1. SMOKETEST (THE FINISHER)
      # ==========================================
      - name: Run Smoketest
        run: |
          # Wir erstellen eine Datei namens .env im docker-Ordner.
          # Das ist der Standardpfad, den Docker Compose IMMER prüft.
          cat <<EOF > docker/.env
          ENV_TYPE=dev
          DB_HOST=db
          DB_NAME=lyndrix_db
          DB_USER=admin
          DB_PASSWORD=testpass
          DB_ROOT_PASSWORD=testroot
          STORAGE_SECRET=test_secret_12345
          LYNDRIX_MASTER_KEY=12345678901234567890123456789012
          VAULT_URL=http://vault:8200
          VAULT_SKIP_VERIFY=true
          EOF

          # Wir kopieren sie zur Sicherheit auch als .env.dev, 
          # falls das YAML explizit darauf verweist
          cp docker/.env docker/.env.dev

          # Start ohne Schnörkel
          docker compose -f docker/docker-compose.dev.yml up -d --build

          echo "Warte 30s auf MariaDB & Lyndrix..."
          sleep 30

          # Zeige uns, was passiert ist (hilft enorm beim Debuggen)
          docker ps -a
          docker compose -f docker/docker-compose.dev.yml logs db

          if curl --retry 5 --retry-delay 5 -f http://localhost:8081/; then
            echo "✅ ENDLICH! TEST BESTANDEN!"
          else
            echo "❌ IMMER NOCH NICHT? Logs von Lyndrix:"
            docker compose -f docker/docker-compose.dev.yml logs lyndrix
            exit 1
          fi

          docker compose -f docker/docker-compose.dev.yml down -v

      # ==========================================
      # 2. PUBLISH (FIXED CONTEXT)
      # ==========================================
      - name: Log in to Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: . # WICHTIG: Kontext bleibt Root
          file: ./docker/Dockerfile # Dockerfile liegt in /docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
